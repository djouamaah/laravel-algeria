name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10', '11', '12', '13']
        include:
          - laravel: '10'
            testbench: '^8.0'
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
        exclude:
          - laravel: '10'
            php: '8.4'
          - laravel: '10'
            php: '8.5'
          - laravel: '11'
            php: '8.1'
          - laravel: '11'
            php: '8.5'
          - laravel: '12'
            php: '8.1'
          - laravel: '13'
            php: '8.1'
          - laravel: '13'
            php: '8.2'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none

      # Laravel 10 and 11 are end-of-life: every release has an unpatched security advisory,
      # so Composer refuses to install them. Allow it here, in CI only, to keep testing compatibility.
      - name: Allow end-of-life Laravel versions
        if: matrix.laravel == '10' || matrix.laravel == '11'
        run: |
          php -r '$c = json_decode(file_get_contents("composer.json"), true);
                  $c["config"]["audit"]["block-insecure"] = false;
                  $c["config"]["policy"]["advisories"]["block"] = false;
                  file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE));'

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  data:
    name: Data files are up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild data/*.json
        run: python -I tools/build.py

      - name: Check for differences
        run: git diff --exit-code data/
